<!doctype html>
<html lang="sk">
<head>
<script>
// Anything that breaks while the app starts shows on screen: on the iPhone there is no console to
// read (Stanley 2026-11-13: tabs dead on the phone, fine in every desktop browser).
(() => {
  const show = m => {
    const d = document.getElementById('boot-err') || Object.assign(document.createElement('pre'), { id: 'boot-err' });
    d.style.cssText = 'position:fixed;left:8px;right:8px;top:calc(env(safe-area-inset-top) + 8px);z-index:99;margin:0;padding:10px;border-radius:10px;background:#a32d2d;color:#fff;font:12px/1.4 ui-monospace,monospace;white-space:pre-wrap;max-height:45vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + '\n' : 'Chyba appky (pošli screenshot):\n') + m;
    (document.body || document.documentElement).appendChild(d);
    document.getElementById('splash')?.remove();   // never leave the app hidden behind it
  };
  addEventListener('error', e => show(`${e.message} @ ${String(e.filename).split('/').pop()}:${e.lineno}:${e.colno}`));
  addEventListener('unhandledrejection', e => show(`promise: ${e.reason?.stack || e.reason?.message || e.reason}`));
  setTimeout(() => { if (!window.__appReady) show('Appka sa po 8 s nenačítala celá (app.js nedobehol).'); }, 8000);
})();
</script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Skok</title>
<meta name="description" content="Rozbor skoku do diaľky z videa">
<meta name="theme-color" content="#f4f3ef">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Skok">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/player.css">
</head>
<body>
<header class="top">
  <button class="top-back hidden" id="back" aria-label="Späť">‹ Späť</button>
  <button class="who-chip" id="who" aria-label="Prepnúť atléta"></button>
  <button class="top-who hidden" id="res-who" aria-label="Zmeniť atléta pri tomto pokuse"></button>
  <button class="gear" id="gear" aria-label="Nastavenia"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg></button>
</header>

<!-- Covers the screen until the app has loaded (Stanley 2026-11-14), so nothing looks tappable before it works -->
<div id="splash" aria-hidden="true"><div class="splash-in"><b>Skok</b><span class="splash-dot"></span></div></div>
<main>
  <!-- Tréning: what you're doing, film or upload, Freelap, today's analyses -->
  <section class="view" id="view-train">
    <div class="card train-card">
      <h2>Tréning</h2>
      <div class="segc" role="tablist" aria-label="Druh rozboru">
        <button data-kind="skok">Skok</button><button data-kind="sprint">Šprint</button><button data-kind="rsi">RSI</button>
      </div>
      <div class="sp-btns">
        <button class="btn go primary" id="train-film">Natočiť</button>
        <label class="btn go" id="train-pick">Nahrať<input type="file" id="file" accept="video/*,.mov,.mp4" hidden></label>
      </div>
      <p class="note" id="train-hint"></p>
      <p class="note train-progress hidden" id="train-progress" aria-live="polite"></p>
    </div>
    <div class="card fl-mini" id="fl-mini"></div>
    <div class="card" id="today"></div>
  </section>

  <!-- História: every analysis, filtered; Freelap times under their own filter -->
  <section class="view hidden" id="view-history">
    <div class="card">
      <h2>História</h2>
      <div class="filt" id="hist-filter">
        <button data-f="all" class="on">Všetko</button><button data-f="skok">Skok</button><button data-f="sprint">Šprint</button><button data-f="rsi">RSI</button><button data-f="freelap">Freelap</button>
      </div>
      <div id="hist-list"></div>
    </div>
    <div class="stack hidden" id="freelap"></div>
  </section>

  <!-- Progres: trends for the athlete in the header, then PB and goal -->
  <section class="view hidden" id="view-progress"><div class="stack" id="trends"></div><div class="stack" id="progress"></div></section>

  <!-- Nastavenia (the gear in the header) -->
  <section class="view hidden" id="view-settings">
    <div class="card settings">
      <h2>Nastavenia</h2>
      <label class="field"><span>Kľúč k serveru</span>
        <input id="cloud-token" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="vlož kľúč">
      </label>
      <button class="btn" id="cloud-save">Uložiť kľúč</button>
      <p class="note" id="cloud-state"></p>
      <p class="note" id="ver"></p>
    </div>
  </section>

  <!-- Detail of a sprint or an RSI analysis -->
  <section class="view hidden" id="view-detail"><div class="stack hidden" id="fl-run"></div><div class="stack" id="sprint"></div><div class="stack" id="rsi"></div></section>

  <!-- Výsledok -->
  <section class="view hidden" id="view-result">
    <div class="card empty" id="res-empty">
      <p>Zatiaľ tu nič nie je.</p>
      <button class="btn" data-tab="train">Natočiť alebo nahrať</button>
    </div>

    <div class="card hidden" id="res-progress" aria-live="polite">
      <div class="pose-line"><span id="pose-stage"></span><span id="pose-pct"></span></div>
      <div class="meter"><div id="pose-bar"></div></div>
      <div class="row prog-actions">
        <button class="btn" id="res-notify" hidden>Upozorni ma, keď bude hotovo</button>
        <button class="btn" id="res-cancel">Zrušiť</button>
      </div>
    </div>

    <div class="hidden" id="res-msg"></div>
    <div class="card hidden" id="res-feel"></div>

    <div class="stack hidden" id="res-after">
      <div class="card" id="res-summary">
        <div id="res-score"></div>
        <div class="tiles" id="res-tiles" role="group" aria-label="Fázy skoku"></div>
        <div class="keyframes" id="res-chips" role="toolbar" aria-label="Kľúčové momenty"></div>
        <div id="res-take"></div>
      </div>
      <div class="card player-card" id="player-card"><div id="player" class="player"></div></div>
      <div class="card" id="res-detail"></div>
      <div class="card" id="res-speed"></div>
      <div class="stack" id="res-coach"></div>
      <details class="card all"><summary>Všetky čísla</summary><div id="res-all"></div></details>
      <button class="btn danger" id="res-del" data-del="">Zmazať pokus</button>
    </div>
  </section>

</main>

<nav class="tabs" aria-label="Hlavná navigácia">
  <button class="tab on" data-tab="train" aria-current="page">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h10l3-3h3v16H4z"/><circle cx="12" cy="13" r="3.5"/></svg><span>Tréning</span>
  </button>
  <button class="tab" data-tab="history">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span>História</span>
  </button>
  <button class="tab" data-tab="progress">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 18l5-6 4 3 7-9"/><path d="M15 6h5v5"/></svg><span>Progres</span>
  </button>
</nav>

<script>
// Tabs work from the first tap (Stanley 2026-11-14: after opening, a tab took several taps). The
// app's code takes a moment to load on the phone; until it has, this switches the view itself and
// app.js picks the tab up when it is ready.
document.addEventListener('click', e => {
  const b = !window.__appReady && e.target.closest('[data-tab]');
  if (!b) return;
  const name = b.dataset.tab;
  for (const v of document.querySelectorAll('main > .view')) v.classList.toggle('hidden', v.id !== `view-${name}`);
  for (const t of document.querySelectorAll('.tab')) t.classList.toggle('on', t === b);
  window.__bootTab = name;
});
</script>
<script type="module" src="js/app.js"></script>
</body>
</html>
