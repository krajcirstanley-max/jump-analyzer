<!doctype html>
<html lang="sk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Skok</title>
<meta name="description" content="Rozbor skoku do diaľky z videa">
<meta name="theme-color" content="#f4f3ef">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Skok">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<link rel="stylesheet" href="css/app.css">
<link rel="stylesheet" href="css/player.css">
</head>
<body>
<header class="top">
  <button class="top-who hidden" id="res-who" aria-label="Zmeniť atléta pri tomto pokuse"></button>
</header>

<main>
  <!-- Domov -->
  <section class="view" id="view-home">
    <label class="btn primary go" for="file">Nahrať video</label>
    <p class="hint">Kto skáče, appka zistí z videa sama.</p>
    <input type="file" id="file" accept="video/*,.mov,.mp4" hidden>
    <p class="hint">Vyber originál: <b>Photos → Share → Export Unmodified Original → Files</b>, potom tu <b>Choose File</b>. Photo Library dá len 30 fps kópiu.</p>

    <details class="card settings">
      <summary>Nastavenia</summary>
      <label class="field"><span>Kľúč k serveru</span>
        <input id="cloud-token" type="password" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="vlož kľúč">
      </label>
      <button class="btn" id="cloud-save">Uložiť kľúč</button>
      <p class="note" id="cloud-state"></p>
      <p class="note" id="ver"></p>
    </details>
  </section>

  <!-- Výsledok -->
  <section class="view hidden" id="view-result">
    <div class="card empty" id="res-empty">
      <p>Zatiaľ tu nič nie je.</p>
      <button class="btn" data-tab="home">Nahrať video</button>
    </div>

    <div class="card hidden" id="res-progress" aria-live="polite">
      <div class="pose-line"><span id="pose-stage"></span><span id="pose-pct"></span></div>
      <div class="meter"><div id="pose-bar"></div></div>
      <div class="row prog-actions">
        <button class="btn" id="res-notify" hidden>Upozorni ma, keď bude hotovo</button>
        <button class="btn" id="res-cancel">Zrušiť</button>
      </div>
    </div>

    <div class="hidden" id="res-msg"></div>
    <div class="card hidden" id="res-feel"></div>

    <div class="stack hidden" id="res-after">
      <div class="card" id="res-summary">
        <div id="res-score"></div>
        <div class="tiles" id="res-tiles" role="group" aria-label="Fázy skoku"></div>
        <div class="keyframes" id="res-chips" role="toolbar" aria-label="Kľúčové momenty"></div>
      </div>
      <div class="card player-card" id="player-card"><div id="player" class="player"></div></div>
      <div class="card" id="res-detail"></div>
      <div class="card" id="res-speed"></div>
      <div class="stack" id="res-coach"></div>
      <details class="card all"><summary>Všetky čísla</summary><div id="res-all"></div></details>
      <button class="btn danger" id="res-del" data-del="">Zmazať pokus</button>
    </div>
  </section>

  <!-- Progres -->
  <section class="view hidden" id="view-progress"><div class="stack" id="progress"></div></section>

  <!-- RSI -->
  <section class="view hidden" id="view-rsi"><div class="stack" id="rsi"></div></section>

  <!-- Sprint -->
  <section class="view hidden" id="view-sprint"><div class="stack" id="sprint"></div><div class="stack" id="freelap"></div></section>

</main>

<nav class="tabs" aria-label="Hlavná navigácia">
  <button class="tab on" data-tab="home" aria-current="page">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 11l8-7 8 7v9h-5v-6H9v6H4z"/></svg><span>Domov</span>
  </button>
  <button class="tab" data-tab="result">
    <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg><span>Výsledok</span>
  </button>
  <!-- Progres hidden for now (Stanley, 2026-11-13: "progress tab asi môže zmiznúť zatiaľ"); the view and its code stay. -->
  <button class="tab" data-tab="rsi">
    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 20h4M17 20h4M7 20l3-12 4 8 3-4"/></svg><span>RSI</span>
  </button>
  <button class="tab" data-tab="sprint">
    <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="7" width="13" height="10" rx="2"/><path d="M16 11l5-3v8l-5-3"/></svg><span>Sprint</span>
  </button>
</nav>

<script type="module" src="js/app.js"></script>
</body>
</html>
